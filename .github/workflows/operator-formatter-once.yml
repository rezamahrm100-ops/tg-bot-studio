name: One-time operator preference formatter
on:
  push:
    branches: [feat/operator-owner-personalization-core]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format only operator changes
        run: |
          bunx prettier --write \
            src/server/operator-client/operator-client.service.ts \
            src/server/operator-client/operator-client.module.ts \
            src/server/operator-client/operator-preferences.ts \
            src/server/operator-client/operator-preferences.controller.ts \
            src/server/operator-client/operator-preferences.test.ts \
            src/client/src/telegram/TelegramOperatorLayout.tsx \
            docs/TELEGRAM_OPERATOR_UX.md
      - name: Commit branch-only formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/server/operator-client src/client/src/telegram/TelegramOperatorLayout.tsx docs/TELEGRAM_OPERATOR_UX.md
            git commit -m "style(operator): apply Prettier to owner personalization"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
