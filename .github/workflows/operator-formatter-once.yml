name: One-time operator preference formatter
on:
  push:
    branches: [feat/operator-owner-personalization-core]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/client/src/telegram/TelegramOperatorLayout.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/client/src/telegram/TelegramOperatorLayout.tsx
            git commit -m "style(operator): format split favorite/navigation controls"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
