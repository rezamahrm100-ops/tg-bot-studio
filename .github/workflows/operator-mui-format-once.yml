name: One-time MUI compatibility formatting
on:
  push:
    branches:
      - feat/telegram-native-operator-ux
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'rezamahrm100-ops/tg-bot-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/telegram-native-operator-ux
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/client/src/telegram/LiveModuleFallbackPage.tsx src/client/src/telegram/TelegramOperatorLayout.tsx
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/src/telegram/LiveModuleFallbackPage.tsx src/client/src/telegram/TelegramOperatorLayout.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(telegram-ux): format MUI compatibility fixes'
            git push origin HEAD:feat/telegram-native-operator-ux
          fi
