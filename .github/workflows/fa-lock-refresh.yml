name: Persian locale branch lockfile refresh (one shot)
on:
  push:
    branches:
      - feature/persian-rtl
permissions:
  contents: write
concurrency:
  group: fa-lock-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.repository == 'rezamahrm100-ops/tg-bot-studio' &&
      github.actor == 'rezamahrm100-ops' &&
      !contains(github.event.head_commit.message, 'chore(lock):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout owner feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/persian-rtl
          persist-credentials: true
      - name: Use pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve lockfile and format only localization changes
        run: |
          bun install
          bunx prettier --write package.json src/client/src/i18n/index.ts src/client/src/theme.tsx src/client/src/main.tsx src/client/src/styles.css src/client/src/i18n/__tests__/i18n-parity.test.ts src/client/src/i18n/locales/fa.json src/client/src/i18n/locales/modules.fa.json
      - name: Commit exact dependency and formatting updates to owner branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json src/client/src/i18n/index.ts src/client/src/theme.tsx src/client/src/main.tsx src/client/src/styles.css src/client/src/i18n/__tests__/i18n-parity.test.ts src/client/src/i18n/locales/fa.json src/client/src/i18n/locales/modules.fa.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lock): freeze Persian RTL dependencies and formatting"
            git push origin HEAD:feature/persian-rtl
          fi
