name: Persian translation workflow availability probe
on:
  push:
    branches:
      - feature/persian-full-catalog-candidate
    paths:
      - .github/workflows/fa-full-catalog-candidate.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test hosted runner dispatch without secrets
        run: echo 'FA_HOSTED_RUNNER=AVAILABLE'
